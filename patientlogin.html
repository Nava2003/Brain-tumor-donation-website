<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>
    <link rel="stylesheet" href="patientlogin.css">
</head>
<body>
    <div class="dpages">
        <h1>Patient Login</h1>
    </div>

    <div class="center-buttons">
        <button id="create-account" class="toggle-button">Create an Account</button>
        <button id="already-account" class="toggle-button">Already Have an Account</button>
    </div>

    <div class="logincontainer">
        <!-- Signup Form -->
        <div class="signup" id="signup-form">
            <h2>Create an Account</h2>
            <table>
                <tr class="details">
                    <td>Name</td>
                    <td><input type="text" placeholder="Enter your Name"></td>
                </tr>
                <tr class="details">
                    <td>Username</td>
                    <td><input type="text" placeholder="Enter your Username"></td>
                </tr>
                <tr class="details">
                    <td>Password</td>
                    <td><input type="password" placeholder="Enter your Password"></td>
                </tr>
            </table>
            <button class="pbutton" id="signup">Signup</button>
        </div>

        <!-- Signin Form -->
        <div class="signin" id="signin-form">
            <h2>Sign In</h2>
            <table>
                <tr class="details">
                    <td>Username</td>
                    <td><input type="text" id="login-username" placeholder="Enter your Username"></td>
                </tr>
                <tr class="details">
                    <td>Password</td>
                    <td>
                        <input type="password" id="login-password" placeholder="Enter your Password">
                        <button id="fpass">Forgot Password</button>
                    </td>
                </tr>
                <tr id="new-password-field" class="details" style="display: none;">
                    <td>New Password</td>
                    <td><input type="password" id="new-password" placeholder="Enter new Password"></td>
                </tr>
                <tr id="reset-password-btn" style="display: none;">
                    <td colspan="2">
                        <button id="reset-password">Reset Password</button>
                    </td>
                </tr>
                
            </table>
            <button class="pbutton" id="signin">Signin</button>
        </div>
    </div>
   
      

    <script src="patientlogin.js"></script>
</body>
</html>
