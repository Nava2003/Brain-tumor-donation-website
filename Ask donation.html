<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Donation for Brain Tumor</title>
    <link rel="stylesheet" type="text/css" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <div class="dpage">
    <h1 >Donation For Braintumor</h1>
    </div>
    <div class="dprofile-container">
        <div class="notification">
            <button  class="donorinfo">donordetails</button>
        </div>
        <div class="donordetails">
            <div>
            <p><icon class="fa-solid fa-xmark"></icon></p>
           </div>

        </div>
    <div class="dprofile">
        <button class="addbutton" >+</button>
       
       
        <button class="delete">Delete</button>
    </div>
    </div>
        <div class="dform">
     <table class="formelemnts">
        <tr class="patientinfo">
            <td>Name</td><td><input type="text"  placeholder="Enter your name"></td>
        </tr>
        <tr class="patientinfo">
            <td>Age</td><td><input type="number" placeholder="Enter your age"></td>
        </tr>
        <tr class="patientinfo">
            <td>Mobile Number</td><td><input type="number" placeholder="mobile number"></td>
        </tr>
        <tr class="patientinfo">
            <td>Gender</td>
            <td>
                <div class="gender-options">
                    <label>
                        <input type="radio" value="male" name="Gender"> Male
                    </label>
                    <label>
                        <input type="radio" value="female" name="Gender"> Female
                    </label>
                </div>
            </td>
        </tr>
        
        <tr class="patientinfo">
            <td>Mail id</td><td><input type="text" placeholder="Enter your mailid"></td>
        </tr>
        <tr class="patientinfo">
            <td>Upload photo</td><td> <input type="file" class="image-upload" placeholder="click here to upload your photo"></td>
            
        </tr> 
        <tr class="patientinfo">
            <td>Upi id</td> <td><input type="text" placeholder="Enter your upi id trust us it will be secured"></td>
        </tr>
        <tr class="patientinfo">
            <td>ACcount number</td><td><input type="number" placeholder="Enter your Bank account number trust us it will be secured safely"></td>
        </tr>

    </table>
    
    <div class="dform-buttons">
        <button class="savebutton" >Save Info</button>
        <button class="cancelbutton" >Cancel</button>
    </div>
     </div>
     </body>
     <script src="script.js"></script>
    
</html>
